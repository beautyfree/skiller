# Builds the public landing and blog into .site, then publishes to GitHub Pages.
#
# Last failure (2026-04-16): configure-pages returned 404 "Get Pages site failed"
# because Pages was not enabled for the repo. Fix either:
#   Settings → Pages → Build: GitHub Actions
# or rely on enablement: true below (needs default GITHUB_TOKEN with pages: write).

name: Deploy docs to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "website/**"
      - "scripts/build-site.py"
      - "scripts/test-site.py"
      - "scripts/test-download.mjs"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "scripts/build-site.py"
      - "scripts/test-site.py"
      - "scripts/test-download.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Build and validate public site
        run: |
          node --test scripts/test-download.mjs
          python3 scripts/test-site.py
          python3 scripts/build-site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./.site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
