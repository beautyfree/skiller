name: Release Please Tag and Release

# Handles release finalization for merged Release Please PRs:
# - creates/pushes vX.Y.Z tag
# - creates draft GitHub release
# - directly calls release.yml to verify, build, upload, and publish it
#
# A direct reusable-workflow call is deliberate. `workflow_run` cannot see
# Release Please's outputs and therefore used to start a failing release run
# whenever Release Please completed successfully without creating a draft.

on:
  push:
    branches:
      - main
    # Release-PR merges modify only these metadata files.
    paths:
      - "CHANGELOG.md"
      - "apps/desktop/package.json"
      - ".release-please-manifest.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please-release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release_please.outputs.release_created }}
      tag: ${{ steps.release_please.outputs.tag_name }}
      target: ${{ steps.release_please.outputs.sha }}
    steps:
      - id: release_please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
          # release.yml is called directly below. This deliberately uses the
          # repository token: no long-lived PAT is needed.
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: release-please-release
    if: needs.release-please-release.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit
    with:
      tag: ${{ needs.release-please-release.outputs.tag }}
      target: ${{ needs.release-please-release.outputs.target }}
