name: Release Please Tag and Release

# Handles only release finalization for merged release PRs:
# - creates/pushes vX.Y.Z tag
# - creates draft GitHub release
# Build/upload/publish is handled by release.yml after this workflow completes.

on:
  push:
    branches:
      - main
    # Release-PR merges modify only these metadata files.
    paths:
      - "CHANGELOG.md"
      - "package.json"
      - ".release-please-manifest.json"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please-release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4.2.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
          # Release builds start from release.yml's `workflow_run` trigger.
          # This deliberately uses the repository token: no long-lived PAT is
          # needed, and GitHub cannot silently suppress the build hand-off.
          token: ${{ secrets.GITHUB_TOKEN }}
