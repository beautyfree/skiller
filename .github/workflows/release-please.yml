name: Release Please PR

# Opens / updates a "Release PR" whenever conventional-commits land on main.
# This workflow only manages the PR itself. The actual tag + draft release
# creation is handled by `release-please-release.yml` on release-PR merge
# commits, which avoids release/PR race conditions.

on:
  push:
    branches:
      - main
    # Ignore release-PR merge commits (these only touch release metadata files).
    # They are handled by release-please-release.yml.
    paths-ignore:
      - "CHANGELOG.md"
      - "package.json"
      - ".release-please-manifest.json"

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.release_please.outputs.prs_created }}
      pr: ${{ steps.release_please.outputs.pr }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 1

      - id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          manifest_version="$(jq -r '.["."]' .release-please-manifest.json)"
          tag="v${manifest_version}"

          if ! git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release baseline tag ${tag} is missing; skipping PR generation to avoid changelog backfill."
            exit 0
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>/dev/null || true)"
          if [[ -z "${release_json}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release ${tag} is not visible yet; skipping PR generation to avoid changelog backfill."
            exit 0
          fi

          if [[ "$(jq -r '.draft' <<<"${release_json}")" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release ${tag} is still draft; skipping PR generation until publish-release completes."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Release baseline ${tag} is published; proceeding."

      - id: release_please
        uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4.2.0
        if: steps.gate.outputs.skip != 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
          # Release builds use release.yml's `workflow_run` trigger after the
          # release-finalization workflow succeeds. GITHUB_TOKEN is therefore
          # sufficient and a missing PAT cannot leave a draft unreleased.
          token: ${{ secrets.GITHUB_TOKEN }}

  verify-release-pr:
    name: Verify release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - id: pr
        env:
          PR: ${{ needs.release-please.outputs.pr }}
        run: |
          set -euo pipefail
          echo "head_sha=$(jq -r '.sha' <<<"$PR")" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(jq -r '.headBranchName' <<<"$PR")" >> "$GITHUB_OUTPUT"
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" \
            -f name=Verify -f head_sha="$HEAD_SHA" -f status=in_progress \
            --jq .id > check_id
          echo "id=$(<check_id)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Mark release PR check successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.check.outputs.id }}
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/$CHECK_ID" -f status=completed -f conclusion=success
      - name: Mark release PR check failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_ID: ${{ steps.check.outputs.id }}
        run: gh api --method PATCH "repos/${GITHUB_REPOSITORY}/check-runs/$CHECK_ID" -f status=completed -f conclusion=failure
