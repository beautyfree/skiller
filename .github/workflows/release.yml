name: Release

# This workflow is called directly by Release Please after it has created a
# draft. Keeping both operations in one workflow graph makes the hand-off
# explicit: a successful Release Please run that did not create a release
# simply skips this workflow, rather than starting a second workflow that has
# to guess whether a draft should exist for the triggering SHA.
on:
  workflow_call:
    inputs:
      tag:
        description: Draft release tag created by Release Please
        required: true
        type: string
      target:
        description: Immutable commit SHA tagged by Release Please
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to rebuild or publish (for example v0.2.24)
        required: true
        type: string
      target:
        description: Immutable commit SHA targeted by the draft release
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve draft release
    runs-on: ubuntu-latest
    permissions:
      # GitHub only exposes a draft created by another workflow to a token
      # that can manage releases. This job only resolves metadata; it does
      # not write until the dedicated publish job below.
      contents: write
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      target: ${{ steps.release.outputs.target }}
    steps:
      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          # Release Please creates the draft immediately before calling this
          # workflow. Fetch the release by its explicit tag, not by a heuristic
          # SHA lookup. The retry only handles GitHub API propagation delay.
          release=""
          for attempt in {1..10}; do
            release="$(gh api "repos/${REPOSITORY}/releases/tags/${REQUESTED_TAG}" 2>/dev/null || true)"
            # GitHub's tag endpoint hides drafts, even from a workflow token.
            # Fall back to the releases collection so manual and Release Please
            # drafts are resolved by their explicit tag instead of being
            # mistaken for a published `null` response.
            if [[ -z "${release}" || "$(jq -r '.tag_name // empty' <<<"${release}")" != "${REQUESTED_TAG}" ]]; then
              releases="$(gh api "repos/${REPOSITORY}/releases?per_page=100")"
              release="$(jq -c --arg tag "${REQUESTED_TAG}" '[.[] | select(.tag_name == $tag)] | first // empty' <<<"${releases}")"
            fi
            [[ -n "${release}" ]] && break
            echo "Draft release ${REQUESTED_TAG} is not visible yet (attempt ${attempt}/10); retrying..."
            sleep 3
          done
          [[ -n "${release}" ]] || { echo "Draft release ${REQUESTED_TAG} was not found after 30 seconds." >&2; exit 1; }

          release_target="$(jq -r '.target_commitish // empty' <<<"${release}")"
          # A draft created by Release Please does not yet expose a Git ref
          # through the REST API, so its target_commitish may be null even
          # though the caller already has the immutable release SHA. Use that
          # explicit hand-off value; workflow_dispatch still requires a
          # target exposed by the pre-existing draft.
          target="${REQUESTED_TARGET:-${release_target}}"
          [[ -n "${target}" ]] || {
            echo "Draft ${REQUESTED_TAG} does not expose a target commit; rerun it through Release Please." >&2
            exit 1
          }
          if [[ -n "${REQUESTED_TARGET}" ]]; then
            tag_target="$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/tags/${REQUESTED_TAG}^{}" | awk 'NR == 1 { print $1 }')"
            if [[ -z "${tag_target}" ]]; then
              tag_target="$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/tags/${REQUESTED_TAG}" | awk 'NR == 1 { print $1 }')"
            fi
            if [[ "${tag_target}" != "${REQUESTED_TARGET}" ]]; then
              echo "Tag ${REQUESTED_TAG} resolves to ${tag_target:-nothing}, expected ${REQUESTED_TARGET}." >&2
              exit 1
            fi
          fi

          if [[ "$(jq -r '.draft' <<<"${release}")" != "true" ]]; then
            echo "Release $(jq -r '.tag_name' <<<"${release}") is already published; refusing to replace its assets."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag_name' <<<"${release}")" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"

  verify-release:
    name: Verify release commit
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ needs.resolve-release.outputs.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 libxss1 libnss3 libasound2t64 fakeroot dpkg
      - name: Package Linux without publishing
        working-directory: apps/desktop
        run: |
          bun run build
          bun x electron-builder --linux --publish never
          bun run scripts/patch-appimage-runtime.mjs ../../artifacts

  build-desktop:
    name: Build ${{ matrix.label }}
    needs: [resolve-release, verify-release]
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos
            runner: macos-14
            platform: macos
          - label: windows-x64
            runner: windows-latest
            platform: windows
          - label: linux-x64
            runner: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ needs.resolve-release.outputs.target }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14

      # create-dmg builds the styled drag-to-Applications DMG that
      # scripts/repack-dmg.sh wraps around electron-builder's signed .app.
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # Native module build toolchain for better-sqlite3 under Electron's ABI.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 \
            libxss1 libnss3 libasound2t64 \
            fakeroot dpkg xvfb

      - run: bun install --frozen-lockfile

      - name: Rebuild native modules
        working-directory: apps/desktop
        run: bun x electron-builder install-app-deps

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/skiller-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$MACOS_CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          rm -f "$CERT_PATH"

      - name: Write notarization API key (macOS)
        if: runner.os == 'macOS' && env.APPLE_API_KEY_P8 != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build macOS app
        if: matrix.platform == 'macos'
        working-directory: apps/desktop
        env:
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          bun run build
          bun x electron-builder --mac --arm64 --x64 --publish never
          bash scripts/repack-dmg.sh arm64
          bash scripts/repack-dmg.sh x64

      - name: Build Windows app
        if: matrix.platform == 'windows'
        working-directory: apps/desktop
        run: |
          bun run build
          bun x electron-builder --win --publish never

      - name: Smoke-test packaged Windows app
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $app = Get-ChildItem artifacts/win-unpacked/*.exe | Select-Object -First 1
          if (-not $app) { throw "Unpacked Windows application was not produced" }
          $process = Start-Process -FilePath $app.FullName -ArgumentList "--disable-gpu" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Packaged Windows application exited during startup" }
          Stop-Process -Id $process.Id -Force

      - name: Build Linux app
        if: matrix.platform == 'linux'
        working-directory: apps/desktop
        run: |
          bun run build
          bun x electron-builder --linux --publish never
          bun run scripts/patch-appimage-runtime.mjs ../../artifacts

      - name: Smoke-test packaged Linux app
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find artifacts -maxdepth 1 -name '*.AppImage' -print -quit)"
          [[ -n "$appimage" ]] || { echo "AppImage was not produced"; exit 1; }
          # GitHub's Ubuntu image ships an older unsquashfs than the AppImage
          # builder uses, so extracting the AppImage here produces a false
          # negative. Electron-builder produces the same packaged application
          # in linux-unpacked; launch that bundle under Xvfb and separately
          # assert that the distributable AppImage exists above.
          unpacked_dir="$(find artifacts -maxdepth 1 -type d -name 'linux-unpacked' -print -quit)"
          [[ -n "$unpacked_dir" ]] || { echo "Unpacked Linux directory was not produced"; exit 1; }
          app="$unpacked_dir/skiller"
          [[ -f "$app" ]] || { echo "Unpacked Linux application was not produced"; exit 1; }
          chmod +x "$app"
          set +e
          timeout 10s xvfb-run -a "$app" --no-sandbox --disable-gpu
          status=$?
          set -e
          [[ "$status" == "124" ]] || { echo "Packaged Linux application exited during startup (status $status)"; exit 1; }

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            artifacts/latest*.yml
            artifacts/*.blockmap
            artifacts/*.zip
            artifacts/*.tar.xz
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/*.dmg
          )
          ((${#assets[@]} > 0)) || { echo "No release assets found"; exit 1; }
          gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: [resolve-release, build-desktop]
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.resolve-release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false

  post-release-smoke:
    name: Verify published updater release
    needs: [resolve-release, publish-release]
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify release assets and updater manifests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          [[ "$(jq -r '.draft' <<<"${release}")" == "false" ]]
          version="${TAG#v}"
          assets="$(jq -r '.assets[].name' <<<"${release}")"
          for file in latest.yml latest-linux.yml latest-mac.yml; do
            grep -qx "${file}" <<<"${assets}"
            asset_url="$(jq -r --arg file "$file" '.assets[] | select(.name == $file) | .browser_download_url' <<<"${release}")"
            manifest="$(curl --fail-with-body --location --retry 3 "$asset_url")"
            grep -q "version: ${version}" <<<"${manifest}"
          done
          grep -q '^Skiller-.*win-x64\.exe$' <<<"${assets}"
          grep -q '^Skiller-.*linux-x86_64\.AppImage$' <<<"${assets}"
          grep -q '^Skiller-.*macos-arm64\.dmg$' <<<"${assets}"
