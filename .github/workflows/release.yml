name: Release

# Release Please creates the draft release with GITHUB_TOKEN. GitHub correctly
# refuses to let that token trigger a second workflow from the tag/release
# event, which previously left a draft without installers. `workflow_run` is
# an explicit, reliable hand-off: it starts after Release Please succeeds,
# then resolves the draft that Release Please just created.
on:
  workflow_run:
    workflows: ["Release Please Tag and Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to rebuild or publish (for example v0.2.24)
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.workflow_run.id || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve draft release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      target: ${{ steps.release.outputs.target }}
    steps:
      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release="$(gh api "repos/${REPOSITORY}/releases/tags/${REQUESTED_TAG}")"
            target="$(jq -r '.target_commitish' <<<"${release}")"
          else
            releases="$(gh api "repos/${REPOSITORY}/releases?per_page=100")"
            release="$(jq -c --arg sha "${WORKFLOW_SHA}" '[.[] | select(.draft == true and .target_commitish == $sha)] | first // empty' <<<"${releases}")"
            if [[ -z "${release}" ]]; then
              echo "No draft release was created by this Release Please run; nothing to build."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            target="${WORKFLOW_SHA}"
          fi

          if [[ "$(jq -r '.draft' <<<"${release}")" != "true" ]]; then
            echo "Release $(jq -r '.tag_name' <<<"${release}") is already published; refusing to replace its assets."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag_name' <<<"${release}")" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"

  verify-release:
    name: Verify release commit
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ needs.resolve-release.outputs.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 libxss1 libnss3 libasound2t64 fakeroot dpkg
      - run: bun run dist:linux

  build-desktop:
    name: Build ${{ matrix.label }}
    needs: [resolve-release, verify-release]
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos
            runner: macos-14
            script: dist:mac
          - label: windows-x64
            runner: windows-latest
            script: dist:win
          - label: linux-x64
            runner: ubuntu-latest
            script: dist:linux
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          ref: ${{ needs.resolve-release.outputs.target }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.0.2
        with:
          bun-version: 1.3.14

      # create-dmg builds the styled drag-to-Applications DMG that
      # scripts/repack-dmg.sh wraps around electron-builder's signed .app.
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # Native module build toolchain for better-sqlite3 under Electron's ABI.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 \
            libxss1 libnss3 libasound2t64 \
            fakeroot dpkg

      - run: bun install --frozen-lockfile

      - name: Rebuild native modules
        run: bunx electron-builder install-app-deps

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/skiller-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$MACOS_CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          rm -f "$CERT_PATH"

      - name: Write notarization API key (macOS)
        if: runner.os == 'macOS' && env.APPLE_API_KEY_P8 != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build app
        env:
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: bun run ${{ matrix.script }}

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            artifacts/latest*.yml
            artifacts/*.blockmap
            artifacts/*.zip
            artifacts/*.tar.xz
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/*.dmg
          )
          ((${#assets[@]} > 0)) || { echo "No release assets found"; exit 1; }
          gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: [resolve-release, build-desktop]
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.resolve-release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false

  post-release-smoke:
    name: Verify published updater release
    needs: [resolve-release, publish-release]
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify release assets and updater manifests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          [[ "$(jq -r '.draft' <<<"${release}")" == "false" ]]
          version="${TAG#v}"
          assets="$(jq -r '.assets[].name' <<<"${release}")"
          for file in latest.yml latest-linux.yml latest-mac.yml; do
            grep -qx "${file}" <<<"${assets}"
            asset_url="$(jq -r --arg file "$file" '.assets[] | select(.name == $file) | .browser_download_url' <<<"${release}")"
            manifest="$(curl --fail-with-body --location --retry 3 "$asset_url")"
            grep -q "version: ${version}" <<<"${manifest}"
          done
          grep -q '^Skiller-.*win-x64\.exe$' <<<"${assets}"
          grep -q '^Skiller-.*linux-x86_64\.AppImage$' <<<"${assets}"
          grep -q '^Skiller-.*macos-arm64\.dmg$' <<<"${assets}"
