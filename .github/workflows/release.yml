name: Release

# Release Please creates the draft release with GITHUB_TOKEN. GitHub correctly
# refuses to let that token trigger a second workflow from the tag/release
# event, which previously left a draft without installers. `workflow_run` is
# an explicit, reliable hand-off: it starts after Release Please succeeds,
# then resolves the draft that Release Please just created.
on:
  workflow_run:
    workflows: ["Release Please Tag and Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to rebuild or publish (for example v0.2.24)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.id || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Resolve draft release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      target: ${{ steps.release.outputs.target }}
    steps:
      - id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release="$(gh api "repos/${REPOSITORY}/releases/tags/${REQUESTED_TAG}")"
            target="$(jq -r '.target_commitish' <<<"${release}")"
          else
            releases="$(gh api "repos/${REPOSITORY}/releases?per_page=100")"
            # Release Please normally records the merge SHA as target_commitish.
            # A draft may instead retain `main`; there can be only one draft
            # because release-please.yml blocks the next release PR until it
            # is published, so that fallback remains unambiguous.
            release="$(jq -c --arg sha "${WORKFLOW_SHA}" '[.[] | select(.draft == true and (.target_commitish == $sha or .target_commitish == "main"))] | first // empty' <<<"${releases}")"
            if [[ -z "${release}" ]]; then
              echo "No draft release was created by this Release Please run; nothing to build."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            target="${WORKFLOW_SHA}"
          fi

          if [[ "$(jq -r '.draft' <<<"${release}")" != "true" ]]; then
            echo "Release $(jq -r '.tag_name' <<<"${release}") is already published; refusing to replace its assets."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r '.tag_name' <<<"${release}")" >> "$GITHUB_OUTPUT"
          echo "target=${target}" >> "$GITHUB_OUTPUT"

  build-desktop:
    name: Build ${{ matrix.label }}
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos
            runner: macos-14
            script: dist:mac
          - label: windows-x64
            runner: windows-latest
            script: dist:win
          - label: linux-x64
            runner: ubuntu-latest
            script: dist:linux
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.resolve-release.outputs.target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # create-dmg builds the styled drag-to-Applications DMG that
      # scripts/repack-dmg.sh wraps around electron-builder's signed .app.
      - name: Install create-dmg (macOS)
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # Native module build toolchain for better-sqlite3 under Electron's ABI.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config python3 \
            libxss1 libnss3 libasound2t64 \
            fakeroot dpkg

      - run: bun install --frozen-lockfile

      - name: Rebuild native modules
        run: bunx electron-builder install-app-deps

      - name: Import Developer ID certificate (macOS)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/skiller-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$MACOS_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$MACOS_CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain

          rm -f "$CERT_PATH"

      - name: Write notarization API key (macOS)
        if: runner.os == 'macOS' && env.APPLE_API_KEY_P8 != ''
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Build app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: bun run ${{ matrix.script }}

      - name: Upload build outputs to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          draft: true
          files: |
            artifacts/*.yml
            artifacts/*.blockmap
            artifacts/*.zip
            artifacts/*.tar.xz
            artifacts/*.deb
            artifacts/*.AppImage
            artifacts/*.exe
            artifacts/*.dmg
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [resolve-release, build-desktop]
    if: needs.resolve-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.resolve-release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false
